name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: ./build.sh test

      - name: Build app
        run: ./build.sh

      - name: Validate bundle
        run: |
          plutil -lint "Sticky Fingers.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'Sticky Fingers.app/Contents/Info.plist')" = "com.degenerateuser.stickyfingers"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' 'Sticky Fingers.app/Contents/Info.plist')" = "Sticky Fingers"
          test -x "Sticky Fingers.app/Contents/MacOS/StickyFingers"
          test -f "Sticky Fingers.app/Contents/Resources/LICENSE"
          codesign --verify --deep --strict --verbose=2 "Sticky Fingers.app"

